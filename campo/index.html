<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Safety Go</title>
<meta name="description" content="Herramienta de trabajo en campo conectada con Safety Rounds: calendario, cuestionarios, desviaciones y plan de acción.">
<meta name="theme-color" content="#1E2B6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safety Go">
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="css/campo.css">
<link rel="stylesheet" href="css/stage.css">
</head>
<body class="f-body">

<script>
// Guardia de sesión y modo de visualización.
//   device  móvil, tablet o pantalla táctil: Safety Go ocupa toda la pantalla
//   stage   ordenador (pantalla ancha y ratón): se muestra dentro de un teléfono en pantalla
//   frame   la propia aplicación dentro de ese teléfono (iframe)
//   full    ordenador con «Pantalla completa»
// La sesión real se confirma con el servidor desde js/shell.js cuando hay red.
(function () {
  var inFrame = true;
  try { inFrame = window.top !== window.self; } catch (e) {}

  // Salir de la aplicación (login, Safety Desk) siempre en la ventana completa, no dentro del teléfono
  window.__leave = function (url) {
    var w = inFrame ? window.top : window;
    try { w.location.replace(new URL(url, location.href).href); } catch (e) { location.replace(url); }
  };

  try {
    var raw = localStorage.getItem('sr:auth');
    if (!raw) { window.__leave('../login.html?next=/campo/'); return; }
    // Una cuenta sin acceso a Safety Go (solo gestión) va a Safety Desk
    var access = (JSON.parse(raw) || {}).access;
    if (access && access.go === false) { window.__leave('../index.html'); return; }
  } catch (e) { /* almacenamiento bloqueado: se deja pasar, store.js ya avisa */ }

  var wide = false, mouse = false, full = false;
  try {
    wide = window.matchMedia('(min-width: 1000px) and (min-height: 600px)').matches;
    mouse = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    full = /[?&]full=1/.test(location.search) || sessionStorage.getItem('sr:go-full') === '1';
  } catch (e) {}
  window.__goMode = inFrame ? 'frame' : (wide && mouse) ? (full ? 'full' : 'stage') : 'device';
  document.documentElement.classList.add('go-' + window.__goMode);
})();
</script>

<div class="f-app" id="fApp">

  <!-- Navegación lateral (tablet en horizontal y pantallas grandes) -->
  <aside class="f-rail" id="fRail" aria-label="Navegación principal">
    <div class="f-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><path d="M50 10 L86 25 V52 C86 71 71 85 50 92 C29 85 14 71 14 52 V25 Z" stroke="#fff" stroke-width="7"/><path d="M34 51 L45 62 L67 38" stroke="#F16B6B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </aside>

  <!-- Barra superior: planta, sincronización y cuenta -->
  <header class="f-top" id="fTop">
    <button class="f-top__back" id="fBack" type="button" aria-label="Volver"></button>
    <div class="f-mark f-mark--top" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 100 100" fill="none"><path d="M50 10 L86 25 V52 C86 71 71 85 50 92 C29 85 14 71 14 52 V25 Z" stroke="#fff" stroke-width="7"/><path d="M34 51 L45 62 L67 38" stroke="#F16B6B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <button class="f-plant" id="fPlant" type="button" aria-label="Elegir planta o centro de trabajo">
      <span class="f-plant__icon" id="fPlantIcon"></span>
      <span class="f-plant__text"><small>Planta</small><strong id="fPlantName">Todas las plantas</strong></span>
      <span class="f-plant__chev" id="fPlantChev"></span>
    </button>

    <div class="f-top__run">
      <div class="f-top__title" id="fTitle"></div>
      <div class="f-top__sub" id="fSub"></div>
    </div>
    <div class="f-top__actions" id="fActions"></div>

    <button class="f-sync" id="fSync" type="button" data-status="idle" aria-label="Estado de sincronización">
      <span class="f-sync__icon"></span>
      <span class="f-sync__n" id="fSyncCount" hidden>0</span>
    </button>
    <button class="f-avatar" id="fAvatar" type="button" aria-label="Mi cuenta">·</button>
  </header>

  <main class="f-main">
    <div class="f-offline" id="fOffline" hidden role="status">
      <span id="fOfflineIcon"></span><span id="fOfflineText"></span>
    </div>
    <div class="view" id="view"></div>
  </main>

  <!-- Navegación inferior (móvil y tablet en vertical) -->
  <nav class="f-tabs" id="fTabs" aria-label="Navegación principal"></nav>
</div>

<div id="sheetRoot"></div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
// En la vista de móvil de un ordenador solo se carga el marco del teléfono; la aplicación
// se carga dentro del teléfono (iframe). En el resto de casos, la aplicación entera.
(function () {
  var mode = window.__goMode;
  if (!mode) return;                       // se está redirigiendo (sin sesión o sin acceso)
  var list = mode === 'stage'
    ? ['../js/icons.js', 'js/stage.js']
    : ['../vendor/jspdf.umd.min.js', '../js/icons.js', '../js/store.js', '../js/sync.js', '../js/ui.js',
       '../js/recurrence.js', '../js/calendar-data.js', '../js/seed.js', '../js/builder.js', '../js/runner.js', '../js/pdf.js',
       '../js/mailer.js', '../js/share.js', 'js/core.js', 'js/records.js', 'js/home.js', 'js/calendar.js',
       'js/forms.js', 'js/deviations.js', 'js/actions.js', 'js/shell.js'];
  list.forEach(function (src) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;                       // se ejecutan en este orden
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
