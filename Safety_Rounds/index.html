<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Safety Rounds — Inspecciones de Seguridad y Salud</title>
<meta name="description" content="Gestión de cuestionarios, inspecciones y desviaciones para departamentos de Safety &amp; Health.">
<meta name="theme-color" content="#1E2B6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safety Rounds">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- ===================== Sidebar ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand__mark">
        <svg width="21" height="21" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 10 L86 25 V52 C86 71 71 85 50 92 C29 85 14 71 14 52 V25 Z" fill="none" stroke="#fff" stroke-width="7"/>
          <path d="M34 51 L45 62 L67 38" fill="none" stroke="#F16B6B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand__name" id="brandName">Safety Rounds</div>
        <div class="brand__sub" id="brandSub">Safety &amp; Health</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav__label">Control</div>
      <button class="nav__item" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>

      <div class="nav__label">Operación</div>
      <button class="nav__item" data-route="cuestionarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1.5"/><path d="m9 14 2 2 4-4"/></svg>
        Cuestionarios
      </button>
      <button class="nav__item" data-route="historico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        Visitas realizadas
        <span class="nav__badge nav__badge--muted" id="badgeVisits" hidden>0</span>
      </button>
      <button class="nav__item" data-route="desviaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        Desviaciones
        <span class="nav__badge" id="badgeDev" hidden>0</span>
      </button>
      <button class="nav__item" data-route="acciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        Plan de acción
        <span class="nav__badge" id="badgeActions" hidden>0</span>
      </button>

      <div class="nav__label">Administración</div>
      <button class="nav__item" data-route="configuracion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M9 10h6"/><path d="M9 14h4"/></svg>
        Configuración cuestionarios
      </button>
      <button class="nav__item" data-route="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Ajustes y datos
      </button>
    </nav>

    <div class="sidebar__foot">
      <div class="storage">
        <div class="storage__row">
          <span>Almacenamiento</span>
          <strong id="storageVal">—</strong>
        </div>
        <div class="storage__bar"><div class="storage__fill" id="storageFill" style="width:0%"></div></div>
        <div class="storage__row" style="margin-top:8px;opacity:.6;font-size:11px">
          <span>Safety Rounds</span>
          <span id="appVersion">v2.0</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===================== Main ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menú">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar__head">
        <div class="topbar__title" id="pageTitle">Dashboard</div>
        <div class="topbar__sub" id="pageSub"></div>
      </div>
      <div class="topbar__actions" id="pageActions"></div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/seed.js"></script>
<script src="js/builder.js"></script>
<script src="js/runner.js"></script>
<script src="js/pdf.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/lists.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
